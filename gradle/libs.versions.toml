# Version catalog for NFC Studio.
# All versions are stable releases verified against Maven metadata at project
# bootstrap (see docs/m1-acceptance.md). Do not bump a version without checking
# compatibility with AGP, the Compose compiler, the JDK and the target SDK.

[versions]
agp = "9.4.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
navigationCompose = "2.10.2"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
coreKtx = "1.19.1"
junit4 = "4.13.2"
# Persistence (M4): Room 2.8.x supports KSP2; KSP 2.3.x is Kotlin-version
# independent and supports AGP 9 built-in Kotlin.
room = "2.8.5"
ksp = "2.3.13"
datastore = "1.3.0"
# Serialization runtime 1.12.0 is built with Kotlin 2.4.10; plugin follows kotlin.
serialization = "1.12.0"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
# Compose ui-test pulls espresso 3.5.0, which calls InputManager.getInstance()
# removed in recent Android; 3.7.0 ships with androidx.test runner 1.7.0.
espresso = "3.7.0"
# Matches the kotlinx-coroutines version resolved transitively by lifecycle 2.11.0.
coroutines = "1.9.0"

compileSdk = "37"
minSdk = "26"
targetSdk = "36"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
